services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: inventra
      POSTGRES_PASSWORD: inventra
      POSTGRES_DB: inventra
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventra"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
